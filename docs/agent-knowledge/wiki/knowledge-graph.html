        }
      });

      if (selectedId && visibleIds.has(selectedId)) {
        if (interactionMode === "Path Mode" && pathStartId) {
          if (activePath) {
            highlightPathBetween(activePath);
          } else {
            highlightPathStart(pathStartId);
          }
          openPathDrawer(visibleIds, activePath);
        } else {
          highlightSelection(selectedId);
          openDrawer(selectedId, visibleIds);
        }
      } else {
        clearHighlights();
      }
    }

    function clearHighlights() {
      if (!cy) return;
      cy.elements().removeClass("faded edge-active node-active path-source path-target");
    }

    function highlightSelection(id) {
      if (!cy || !id) return;
      clearHighlights();
      const selected = cy.getElementById(id);
      if (!selected || selected.empty()) return;
      selected.addClass("node-active");
      const connectedEdges = selected.connectedEdges();
      const connectedNodes = connectedEdges.connectedNodes();
      cy.elements().not(selected).not(connectedEdges).not(connectedNodes).addClass("faded");
      connectedEdges.addClass("edge-active");
    }

    function highlightPathStart(id) {
      if (!cy || !id) return;
      clearHighlights();
      const source = cy.getElementById(id);
      if (!source || source.empty()) return;
      cy.elements().not(source).addClass("faded");
      source.removeClass("faded").addClass("node-active path-source");
    }

    function highlightPathBetween(pathResult) {
      if (!cy || !pathResult) return;
      clearHighlights();
      cy.elements().addClass("faded");
      for (const nodeId of pathResult.nodeIds) {
        cy.getElementById(nodeId).removeClass("faded").addClass("node-active");
      }
      for (const edgeId of pathResult.edgeIds) {
        cy.getElementById(edgeId).removeClass("faded").addClass("edge-active");
      }
      if (pathResult.nodeIds.length) {
        cy.getElementById(pathResult.nodeIds[0]).addClass("path-source");
        cy.getElementById(pathResult.nodeIds[pathResult.nodeIds.length - 1]).addClass("path-target");
      }
    }

    function handlePathModeTap(id, visibleIds) {
      if (!pathStartId || (pathStartId && pathTargetId)) {
        pathStartId = id;
        pathTargetId = null;
        activePath = null;
        selectedId = id;
        highlightPathStart(id);
        openPathDrawer(visibleIds, null);
        return;
      }

      pathTargetId = id;
      selectedId = id;
      activePath = findPathBetween(pathStartId, pathTargetId, visibleIds);
      highlightPathBetween(activePath);
      openPathDrawer(visibleIds, activePath);
    }

    function centerOnNode(id) {
      if (!cy || !id) return;
      const selected = cy.getElementById(id);
      if (!selected || selected.empty()) return;
      const container = cy.container();
      if (!container) return;
      const rect = container.getBoundingClientRect();
      const rendered = selected.renderedPosition();
      const currentPan = cy.pan();
      cy.animate({
        pan: {
          x: currentPan.x + (rect.width / 2 - rendered.x),
          y: currentPan.y + (rect.height / 2 - rendered.y),
        },
        duration: 220,
      });
    }

    function fitGraphToViewport() {
      if (!cy) return;
      cy.resize();
      const focused = cy.elements().not(".faded");
      const target = focused.length ? focused : cy.elements();
      if (target.length) {
        cy.fit(target, 96);
        cy.center(target);
      }
    }

    function scheduleFitGraphToViewport() {
      requestAnimationFrame(() => {
        fitGraphToViewport();
      });
      window.setTimeout(() => {
        fitGraphToViewport();
      }, 190);
    }

    function resizeGraphAfterDrawerLayout() {
      requestAnimationFrame(() => {
        if (cy) {
          cy.resize();
        }
      });
      window.setTimeout(() => {
        if (cy) {
          cy.resize();
        }
      }, 190);
    }

    function openDrawer(id, visibleIds) {
      const node = nodeMap.get(id);
      if (!node) return;
      const record = recordMap.get(id);
      const related = [];
      for (const edge of edges) {
        if (edge.from !== id && edge.to !== id) continue;
        const otherId = edge.from === id ? edge.to : edge.from;
        if (visibleIds && !visibleIds.has(otherId)) continue;
        const other = nodeMap.get(otherId);
        if (!other) continue;
        related.push(`
          <div class="detail-item">
            <button type="button" data-related-node="${other.id}">
              <strong>${other.display_label || other.label}</strong><br>
              ${other.type} · ${edge.type}${edge.confidence ? ` · ${edge.confidence}` : ""}
            </button>
          </div>
        `);
      }

      detailsDrawer.classList.remove("hidden");
      detailsDrawer.setAttribute("aria-hidden", "false");
      graphShell.classList.add("drawer-open");
      scheduleFitGraphToViewport();
      drawerBody.textContent = interactionMode === "Path Mode" ? "Path Mode" : "Explain";
      const evidence = record && record.evidence_refs && record.evidence_refs.length
        ? record.evidence_refs.map(ref => `<div class="detail-item">${ref}</div>`).join("")
        : '<div class="detail-item">No captured evidence yet</div>';
      const readiness = record && ["stable", "error-pattern"].includes(record.status)
        ? "Safe to treat as a repository rule."
        : "Do not treat this as a hard repository rule yet.";
      drawerMeta.innerHTML = `
        <div class="detail-block"><h2>Meaning</h2><div class="detail-list"><div class="detail-item">${record ? record.canonical_text : node.label}</div></div></div>
        <div class="detail-block"><h2>Evidence Trail</h2><div class="detail-list">${evidence}</div></div>
        <div class="detail-block"><h2>Status</h2><div class="detail-list"><div class="detail-item">${readiness}</div></div></div>
        <div class="detail-block"><h2>Related Memory</h2><div class="detail-list">${related.length ? related.join("") : '<div class="detail-item">No visible related memory in the current graph.</div>'}</div></div>
      `;
      for (const button of drawerMeta.querySelectorAll("[data-related-node]")) {
        button.addEventListener("click", () => {
          selectedId = button.getAttribute("data-related-node");
          render();
        });
      }
    }

    function openPathDrawer(visibleIds, pathResult) {
      const source = pathStartId ? nodeMap.get(pathStartId) : null;
      const target = pathTargetId ? nodeMap.get(pathTargetId) : null;
      const pathEdges = pathResult ? pathResult.hops : [];
      const hopItems = pathEdges.length
        ? pathEdges.map(edge => {
            const from = nodeMap.get(edge.from);
            const to = nodeMap.get(edge.to);
            return `<div class="detail-item">${from ? from.display_label || from.label : edge.from} <span class="pill">${edge.type}</span> ${to ? to.display_label || to.label : edge.to}</div>`;
          }).join("")
        : '<div class="detail-item">Select a second node to highlight the shortest visible path.</div>';

      detailsDrawer.classList.remove("hidden");
      detailsDrawer.setAttribute("aria-hidden", "false");
      graphShell.classList.add("drawer-open");
      drawerBody.textContent = "Path Mode";
      drawerMeta.innerHTML = `
        <div class="detail-block"><h2>Path Source</h2><div class="detail-list"><div class="detail-item">${source ? source.label : "Select a source node"}</div></div></div>
        <div class="detail-block"><h2>Path Target</h2><div class="detail-list"><div class="detail-item">${target ? target.label : "Select a target node"}</div></div></div>
        <div class="detail-block"><h2>Highlighted Path</h2><div class="detail-list">${hopItems}</div></div>
      `;
      resizeGraphAfterDrawerLayout();
    }

    function render() {
      buildStateFilters();
      buildSavedViews();
      buildModeControls();
      renderGraph();
    }

    searchInput.addEventListener("input", event => {
      searchTerm = normalize(event.target.value);
      selectedId = null;
      resetPathState();
      focusMode = "all";
      render();
    });

    themeSelect.addEventListener("change", event => {
      const nextTheme = event.target.value;
      localStorage.setItem(storageKey, nextTheme);
      applyTheme(nextTheme);
      render();
    });

    explainModeBtn.addEventListener("click", () => {
      interactionMode = "Explain";
      resetPathState();
      render();
    });

    pathModeBtn.addEventListener("click", () => {
      interactionMode = "Path Mode";
      selectedId = null;
      resetPathState();
      render();
    });

    closeDrawerBtn.addEventListener("click", () => {
      detailsDrawer.classList.add("hidden");
      detailsDrawer.setAttribute("aria-hidden", "true");
      graphShell.classList.remove("drawer-open");
      selectedId = null;
      resetPathState();
      focusMode = "all";
      clearHighlights();
      scheduleFitGraphToViewport();
    });

    loadThemePreference();
    render();
  </script>
</body>
</html>
