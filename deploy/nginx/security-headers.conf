# Include this file from every HTTPS server/location that serves the WayX SPA.
# Keep the script and frame allowlists synchronized with enabled payment and verification providers.
server_tokens off;

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://js.stripe.com https://checkout.stripe.com https://challenges.cloudflare.com https://*.airwallex.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://challenges.cloudflare.com https://*.airwallex.com; media-src 'self' data: blob: https:; worker-src 'self' blob:; form-action 'self' https://checkout.stripe.com https://*.airwallex.com; manifest-src 'self'; upgrade-insecure-requests" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=(), browsing-topics=(), clipboard-read=(), clipboard-write=(self), payment=(self \"https://*.stripe.com\" \"https://*.airwallex.com\"), publickey-credentials-get=(self)" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
