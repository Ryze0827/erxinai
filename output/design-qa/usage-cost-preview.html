<!doctype html>
<html lang="zh-CN" data-console-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WayX Usage Cost Preview</title>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { CostCell } from "/src/console/pages/UsagePage.jsx";
      import "/src/console/console.css";

      const row = {
        id: "preview-cost",
        input_tokens: 1570,
        output_tokens: 39,
        cache_creation_tokens: 0,
        cache_read_tokens: 842800,
        input_cost: 0.000314,
        output_cost: 0.0000468,
        cache_creation_cost: 0,
        cache_read_cost: 0.004214,
        total_cost: 0.0045748,
        actual_cost: 0.00068622,
        rate_multiplier: 0.15,
        service_tier: "standard",
        billing_mode: "token",
      };
      const formatNumber = (value, options) => new Intl.NumberFormat("en-US", options).format(value);
      const root = createRoot(document.getElementById("cost-root"));
      root.render(React.createElement(CostCell, { row, formatNumber, locale: "zh" }));
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.documentElement;
        html.dataset.consoleTheme = html.dataset.consoleTheme === "dark" ? "light" : "dark";
      });
    </script>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: #111820; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      html[data-console-theme="light"] body { background: #eef3f5; }
      .preview-stage { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      .preview-card { width: min(720px, 100%); overflow: hidden; border: 1px solid var(--console-line); border-radius: 12px; background: var(--console-surface); box-shadow: var(--console-shadow-lg); }
      .preview-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--console-line); color: var(--console-ink); }
      .preview-toolbar strong { font-size: 13px; }
      .preview-toolbar button { padding: 6px 10px; border: 1px solid var(--console-line); border-radius: 7px; color: var(--console-body); background: var(--console-surface-subtle); cursor: pointer; }
      .preview-table { width: 100%; border-collapse: collapse; color: var(--console-body); }
      .preview-table th, .preview-table td { height: 68px; padding: 0 16px; border-bottom: 1px solid var(--console-line); text-align: left; }
      .preview-table th { height: 42px; color: var(--console-muted); font-size: 11px; font-weight: 650; }
      .preview-table td { font-size: 12px; }
      .preview-table td:nth-child(2) { color: var(--console-accent-strong); font-family: var(--console-font-mono); }
      .preview-hint { margin: 0; padding: 12px 16px; color: var(--console-muted); font-size: 11px; }
    </style>
  </head>
  <body>
    <main class="console-shell preview-stage">
      <section class="preview-card">
        <header class="preview-toolbar"><strong>使用记录 · 费用明细</strong><button id="theme-toggle" type="button">切换主题</button></header>
        <table class="preview-table">
          <thead><tr><th>模型</th><th>Token</th><th>费用</th><th>延迟（首Token / 总计）</th></tr></thead>
          <tbody><tr><td>gpt-5.1</td><td>↓ 0.0016M&nbsp;&nbsp;↑ 0.0000M</td><td><div id="cost-root"></div></td><td>1.24s / 2.08s</td></tr></tbody>
        </table>
        <p class="preview-hint">将鼠标移到费用右侧的信息图标，查看与 sub2api 一致的费用拆分和倍率统计。</p>
      </section>
    </main>
  </body>
</html>
